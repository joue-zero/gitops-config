apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-of-apps
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/joue-zero/gitops-config
    targetRevision: HEAD
    path: apps              # watches the /apps directory in gitops-config

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd       # child Applications also land in argocd namespace

  syncPolicy:
    automated:
      prune: true           # if you delete staging.yaml from /apps, ArgoCD
      selfHeal: true        # deletes the staging Application automatically
    syncOptions:
      - CreateNamespace=true
