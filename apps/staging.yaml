apiVersion: argoproj.io/v1alpha1
kind: Application              # ArgoCD CRD — not a native K8s object
metadata:
  name: app-staging
  namespace: argocd            # ArgoCD Applications always live in argocd namespace
spec:
  project: default             # required by the Application CRD

  # ── QUESTION 1: where is desired state? ──────────────
  # Chart lives in devops-platform. Values live in this repo.
  # Helm valueFiles cannot be raw URLs, so the values repo is a second source.
  sources:
    - repoURL: https://github.com/joue-zero/devops-platform
      targetRevision: HEAD       # always use the latest commit on main
      path: helm/app             # path inside the repo where Chart.yaml lives
      helm:
        valueFiles:
          - $values/environments/staging/values.yaml
    - repoURL: https://github.com/joue-zero/gitops-config
      targetRevision: HEAD
      ref: values                # exposed to Helm as $values/

  # ── QUESTION 3: where to deploy? ─────────────────────
  destination:
    server: https://kubernetes.default.svc  # the cluster ArgoCD runs in
    namespace: staging

  # ── QUESTION 4: when to sync? ────────────────────────
  syncPolicy:
    automated:
      prune: true    # delete resources removed from Git
      selfHeal: true # revert manual changes to match Git
    syncOptions:
      - CreateNamespace=true  # create namespace if it doesn't exist
